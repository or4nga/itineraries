<title>Tang Family Trip Itineraries</title>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--ink:#22252a;--muted:#5f646b;--line:#dcd8cf;--accent:#b4532a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--surface:#1e2228;--ink:#e9e7e2;--muted:#a3a8ae;--line:#323840;--accent:#e08458;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--surface:#1e2228;--ink:#e9e7e2;--muted:#a3a8ae;--line:#323840;--accent:#e08458;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:40px 16px 48px}
h1{font:700 2rem/1.2 Georgia,serif;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent)}
a strong{display:block;font:700 1.2rem/1.3 Georgia,serif;color:var(--accent)}
a span{color:var(--muted);font-size:.95rem}
</style>
</head>
